# Tasks board and quick capture inside herdr. Explicit actions only.

id = "herdr-tsk"
name = "herdr-tsk"
version = "0.11.0"
description = "Queue board and quick capture inside herdr."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos", "windows"]

[[build]]
platforms = ["linux", "macos", "windows"]
command = ["cargo", "build", "--release"]

[[panes]]
id = "board"
title = "tsk"
placement = "split"
command = ["./target/release/tsk"]

[[actions]]
id = "open-board"
platforms = ["linux", "macos"]
title = "Open tsk board"
description = "Open the tsk board in a split pane beside the current work."
command = ["bash", "scripts/open-board.sh"]

[[actions]]
id = "open-board-windows"
platforms = ["windows"]
title = "Open tsk board"
description = "Open the tsk board in a split pane beside the current work."
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-board.ps1"]

[[actions]]
id = "quick-capture"
platforms = ["linux", "macos"]
title = "Quick capture"
description = "Capture a new task with context without first opening the board."
command = ["bash", "scripts/open-capture.sh"]

[[actions]]
id = "quick-capture-windows"
platforms = ["windows"]
title = "Quick capture"
description = "Capture a new task with context without first opening the board."
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/open-capture.ps1"]
