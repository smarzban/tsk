[package]
name = "tsk-tui"
version = "0.11.0"
edition = "2021"
description = "tsk: a task board for your terminal"
license = "MIT"
publish = false
# Root test files are modules unless explicitly registered below.
autotests = false

[[bin]]
name = "tsk"
path = "src/main.rs"

# Shared suites link once; process-global environment/cwd tests stay isolated.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "cli_add"
path = "tests/cli_add.rs"

[[test]]
name = "cli_list"
path = "tests/cli_list.rs"

[[test]]
name = "cli_setup_agent"
path = "tests/cli_setup_agent.rs"

[[test]]
name = "queue_board_loop"
path = "tests/queue_board_loop.rs"

[[test]]
name = "starter_guides"
path = "tests/starter_guides.rs"

[[test]]
name = "update_notice"
path = "tests/update_notice.rs"

# The site generates references without compiling unrelated integration suites.
[[test]]
name = "demo_parity"
path = "tests/demo_parity.rs"

[[test]]
name = "queue_board_bench"
path = "tests/queue_board_bench.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
toml_edit = "0.25.13"
unicode-width = "0.2"
uuid = { version = "1.24", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
# Cargo.lock pins the resolved version; a caret range here keeps another crate's newer
# libc requirement resolvable instead of failing the build.
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# Windows has no guaranteed system curl path. Use a native HTTPS client for the release
# check and to fetch the signed-by-checksum PowerShell installer.
ureq = { version = "3.2", default-features = false, features = ["native-tls", "gzip", "win-system-proxy"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }
