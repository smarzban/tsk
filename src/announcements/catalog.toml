# Maintainer catalog for `src/announcements.rs`. Append with the next id; ids
# increase and are never reused. Changelog URLs go in `notes`, never in `title`.
# A comment-only file means this release has nothing to announce.
#
# id 1 ("Guides and release notes on your desk") was retired before it shipped, so the
# starter tour is the only thing a 0.7.x upgrader sees. The next entry is id 2.
#
# id 4 ("tsk comes to Windows") shipped only in the v0.11.3 to v0.11.5 pre-releases and was
# retired before a stable release. Preview users may hold watermark 4, so the next entry is id 5.

[[announcement]]
id = 2
title = "An inbox, a projects preview, and tsk help"
notes = "New captures start in an open inbox below ON DECK. Pick work with ctrl+n, send it back with ctrl+o, and use tsk list --open or --ready to filter from the CLI.\n\nOn a wide terminal the projects tab previews the cursored project beside the list; press → to work in it. The projects index counts ON DECK and DONE.\n\ntsk --help is the CLI reference: tsk help <command> explains one command, tsk --version prints the version.\n\nAsk your agent to refine a task: \"refine T12\" or \"what is missing from T12\". It reads the task and the code, asks one question at a time, and proposes a rewrite before it edits, so the task is ready for an agent to pick up. Rerun tsk setup to update the skill.\n\nChangelog: https://github.com/smarzban/tsk/blob/main/CHANGELOG.md"

[[announcement]]
id = 3
title = "Search and multi-select tasks"
notes = "Press / on any tab to filter what it shows: tasks by title, notes, steps, thread, or number; projects by name on the projects tab. Enter pins the filter so the usual keys work on the matches; Esc clears it.\n\nPress Shift+M to mark several tasks, with space, Shift+↑/↓, or a click, then run one status, archive, or delete on the whole set. One ctrl+u undoes a marked done or delete.\n\n!p name and tsk add -p name now refuse a name the board does not know instead of creating a stray project. Use a full path to add a new one.\n\nChangelog: https://github.com/smarzban/tsk/blob/main/CHANGELOG.md"
