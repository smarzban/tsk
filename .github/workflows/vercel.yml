name: Vercel

# Deploys are driven here, not by Vercel's Git integration, so only
# changes under site/ or skills/ ever reach Vercel.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "skills/**"
      - ".github/workflows/vercel.yml"

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep repository secrets out of every pull-request event.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          package-manager-cache: false # Keep deployment dependency caching disabled.

      - name: Install Vercel CLI
        run: npm install -g vercel@58.11.0

      - name: Deploy production
        # Run from the repo root: the Vercel project's Root Directory is
        # site/, so the CLI resolves the path itself and would double it.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_eErh7AfvdjecAyy2gaZkY76Q
          VERCEL_PROJECT_ID: prj_CNHAMn4BHWAvMCIasGuOhVHu9jZy
        run: |
          set -o pipefail
          if vercel deploy --prod --yes --token "$VERCEL_TOKEN" > deploy.log 2>&1; then
            cat deploy.log
          else
            status=$?
            cat deploy.log
            exit "$status"
          fi

  windows-installer-route:
    name: Windows PowerShell installer route
    needs: deploy
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Fetch the documented URL with Windows PowerShell 5.1
        shell: powershell
        run: |
          $url = 'https://www.gettsk.sh/install.ps1'
          $response = Invoke-WebRequest -UseBasicParsing $url
          if ($response.StatusCode -ne 200) { throw "expected HTTP 200, got $($response.StatusCode)" }
          if ($response.BaseResponse.ResponseUri.AbsoluteUri -ne $url) { throw "installer URL redirected to $($response.BaseResponse.ResponseUri)" }
          if ($response.Headers['Content-Type'] -notlike 'text/plain*') { throw "unexpected Content-Type: $($response.Headers['Content-Type'])" }
          if ($response.Content -notmatch '^# Install a published tsk release' -or $response.Content -notmatch 'function Main') { throw 'response is not the PowerShell installer' }
