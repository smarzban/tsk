name: Installer

# ci.yml ignores site/**, so the installer would otherwise reach main (and gettsk.sh, which
# serves it from main) untested. Run the contract suite on the PR as well as on the push.
on:
  push:
    branches: [main]
    paths:
      - "site/public/install.sh"
      - "site/public/install.ps1"
      - "scripts/release.py"
      - "tests/packaging/**"
      - ".github/workflows/installer.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/public/install.sh"
      - "site/public/install.ps1"
      - "scripts/release.py"
      - "tests/packaging/**"
      - ".github/workflows/installer.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Packaging contract tests
        run: python3 -m unittest discover -s tests/packaging
      - name: Shellcheck installer
        run: shellcheck site/public/install.sh

  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Windows installer contracts
        run: python tests/packaging/test_install_windows.py
      - name: Windows PowerShell syntax and help smoke
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File site/public/install.ps1 -Help
