name: Prepare release

# Owner-run only. No tag/push trigger and no public publishing or tap credentials.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag matching Cargo.toml (for example v0.5.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            exe_suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe_suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            exe_suffix: ""
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            exe_suffix: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            exe_suffix: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            exe_suffix: .exe
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Validate tag syntax
        shell: bash
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0
        with:
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Test, build and package the tagged source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release.py check-version "$TAG"
          if [ "$RUNNER_OS" != Windows ]; then python -m unittest discover -s tests/packaging; fi
          if [ "$RUNNER_OS" = Windows ]; then python tests/packaging/test_install_windows.py; fi
          if [ "$RUNNER_OS" = Linux ]; then export RUSTFLAGS='-C linker=musl-gcc'; fi
          cargo test --locked --target "$TARGET"
          cargo build --release --locked --target "$TARGET"
          binary="target/${{ matrix.target }}/release/tsk${{ matrix.exe_suffix }}"
          "$binary" --help
          test_binary="$(python -c 'import os, sys; print(os.path.abspath(sys.argv[1]))' "$binary")"
          TSK_TEST_BINARY="$test_binary" python -m unittest discover -s tests/packaging
          if [ "$RUNNER_OS" = Windows ]; then powershell.exe -NoProfile -ExecutionPolicy Bypass -File site/public/install.ps1 -Help; fi
          python scripts/release.py package "$TAG" "$TARGET" "$binary" dist-release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.target }}
          path: dist-release/*
          if-no-files-found: error

  draft:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*-*
          path: dist-release
          merge-multiple: true
      - name: Generate checksums and version-pinned tap formula
        run: python3 scripts/release.py assemble "$TAG" dist-release
      - name: Validate generated Ruby
        run: ruby -c dist-release/tsk.rb
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-bundle
          path: dist-release/*
          if-no-files-found: error
      - name: Refuse a moved tag
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" --jq .sha)" = "$RELEASE_COMMIT"
      - name: Create draft only (refuses an existing release)
        run: gh release create "$TAG" dist-release/* --verify-tag --draft --title "$TAG" --notes-file packaging/RELEASE-NOTES.md
