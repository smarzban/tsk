name: T329 diag (throwaway)
on:
  push:
    branches: [tsk/t329-flaky-windows-test-a-git-meant]
permissions:
  contents: read
jobs:
  diag:
    name: diag ${{ matrix.run }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    env:
      TAG: v0.13.0
      TARGET: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0
        with:
          targets: aarch64-pc-windows-msvc
      - name: Mirror the release step
        shell: bash
        run: |
          set -euo pipefail
          echo "PATH=$PATH"; which git powershell pwsh sh || true; git --version
          python tests/packaging/test_install_windows.py
          cargo test --locked --target "$TARGET"
